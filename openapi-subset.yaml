openapi: 3.0.1
info:
  title: API7 Enterprise - Terraform Provider Subset
  version: 0.11.0
  description: Auto-extracted subset for terraform-provider-api7.
servers: []
security:
- APIKeyAuth: []
- BasicAuth: []
paths:
  /apisix/admin/services:
    post:
      tags:
      - Published Service
      summary: Create a published service on a gateway group
      operationId: createPublishedService
      description: 'Create a published service through an APISIX Admin API compatible
        endpoint under `/apisix/admin/`. The payload follows APISIX conventions while
        operating on the same underlying service resource managed by dashboard APIs.

        **Required IAM Permission:** Action `gateway:CreatePublishedService`, Resource
        `arn:api7:gateway:gatewaygroup/%s/publishedservice/*`'
      parameters:
      - name: gateway_group_id
        description: Gateway group ID. Optional when using the gateway group admin
          key to authenticate.
        example: 86fb9981-d9d2-4555-9df8-91ae92129335
        in: query
        required: true
        schema:
          minimum: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - oneOf:
                - title: HTTP
                  allOf:
                  - type: object
                    properties:
                      name:
                        maxLength: 65536
                        description: The object name.
                        type: string
                        minLength: 1
                        example: us-west-rsc
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                          pattern: ^.+$
                          minLength: 1
                          maxLength: 65536
                        description: Key-value pairs of labels.
                        example:
                          version: v2
                          env: prod
                      desc:
                        description: The object description.
                        type: string
                        maxLength: 65536
                        example: Object description.
                      type:
                        type: string
                        description: Type of service. `http` corresponds to L7 service
                          and `stream` corresponds to L4 service.
                        enum:
                        - http
                        - stream
                        default: http
                  - type: object
                    required:
                    - type
                    properties:
                      type:
                        type: string
                        enum:
                        - http
                      hosts:
                        type: array
                        description: The hosts of the service to accept incoming requests.
                        uniqueItems: true
                        minItems: 1
                        maxItems: 32
                        items:
                          type: string
                          description: The HTTP host.
                          pattern: ^\*?[0-9a-zA-Z-._]+$
                          example: httpbin.org
                      path_prefix:
                        maxLength: 4096
                        minLength: 1
                        pattern: ^/
                        type: string
                        description: The listening path prefix of the service.
                        example: /test
                      strip_path_prefix:
                        type: boolean
                        default: true
                        description: If true, strip the path prefix when proxying
                          the request to the upstream.
                      plugins:
                        description: Key-value pairs of plugins and their configurations
                          on the object.
                        type: object
                        example:
                          key-auth: {}
                  - type: object
                    properties:
                      upstream:
                        description: 'The upstream contains necessary information
                          for the gateway to proxy

                          request to the backend service.

                          '
                        type: object
                        properties:
                          name:
                            default: default
                            maxLength: 65536
                            description: The upstream name.
                            type: string
                            minLength: 1
                            example: us-west-rsc
                          scheme:
                            description: The protocol that is used for communicating
                              with the backend service when the service type is `http`.
                            type: string
                            enum:
                            - http
                            - https
                            - grpc
                            - grpcs
                            default: http
                          desc:
                            description: The object description.
                            type: string
                            maxLength: 65536
                            example: Object description.
                          labels:
                            type: object
                            additionalProperties:
                              type: string
                              pattern: ^.+$
                              minLength: 1
                              maxLength: 65536
                            description: Key-value pairs of labels.
                            example:
                              version: v2
                              env: prod
                          type:
                            type: string
                            default: roundrobin
                            description: Load balancing algorithm to distribute traffic.
                            example: chash
                            enum:
                            - chash
                            - roundrobin
                            - least_conn
                            - ewma
                          hash_on:
                            description: Type of value to hash on when `type` is `chash`.
                            type: string
                            enum:
                            - vars
                            - header
                            - cookie
                            - consumer
                            - vars_combinations
                            default: vars
                          key:
                            type: string
                            minLength: 1
                            description: The `key` is used when `type` is `chash`.
                              The corresponding upstream ID is determined based on
                              the `hash_on` and `key` values. - When `hash_on` is
                              set to `vars`, `key` is required and supports [built-in
                              variables](https://docs.api7.ai/enterprise/reference/built-in-variables).
                              - When `hash_on` is set to `vars_combinations`, `key`
                              is required and supports a combination of [built-in
                              variables](https://docs.api7.ai/enterprise/reference/built-in-variables).
                              - When `hash_on` is set to `header`, `key` is required
                              and should be the name of the header. - When `hash_on`
                              is set to `cookie`, `key` is required and should be
                              the name of the cookie. - When `hash_on` is set to `consumer`,
                              `key` is not required, as the hash algorithm uses the
                              authenticated consumer name.
                            example: $host
                          retries:
                            description: The number of retries while passing the request
                              to an upstream.
                            minimum: 0
                            maximum: 65535
                            type: integer
                            example: 50
                          keepalive_pool:
                            description: Upstream keepalive connection pool.
                            type: object
                            properties:
                              size:
                                description: The number of idle keepalive connections
                                  per worker to upstream servers.
                                minimum: 1
                                type: integer
                                default: 320
                              idle_timeout:
                                description: Time an idle keepalive connection remains
                                  open before being closed, in seconds.
                                minimum: 0
                                type: number
                                format: float
                                default: 60
                              requests:
                                description: The number of requests a single keepalive
                                  connection can handle before closing.
                                minimum: 1
                                type: integer
                                default: 1000
                          timeout:
                            description: Timeout settings for connecting to, sending,
                              and receiving messages from the upstream, in seconds.
                            type: object
                            properties:
                              connect:
                                minimum: 0
                                exclusiveMinimum: true
                                type: integer
                                default: 60
                                description: Connection timeout in seconds.
                              send:
                                minimum: 0
                                exclusiveMinimum: true
                                type: integer
                                default: 60
                                description: Sending timeout in seconds.
                              read:
                                minimum: 0
                                exclusiveMinimum: true
                                type: integer
                                default: 60
                                description: Receiving timeout in seconds.
                          retry_timeout:
                            description: Timeout to continue with retries. Setting
                              this to 0 disables the retry timeout.
                            type: number
                            format: float
                            minimum: 0
                            default: 0
                          pass_host:
                            type: string
                            description: 'The approach to decide the host header before
                              forwarding requests to an upstream.

                              * `pass` uses the host specified in the service.

                              * `node` uses the host specified in the upstream.

                              * `rewrite` uses custom host.'
                            enum:
                            - pass
                            - node
                            - rewrite
                            default: pass
                          upstream_host:
                            description: Value to rewrite the host header to. Only
                              used if `pass_host` is `rewrite`.
                            type: string
                            pattern: ^\*?[0-9a-zA-Z-._]+$
                            example: httpbin.org
                          nodes:
                            type: array
                            description: The upstream endpoints.
                            example:
                            - host: httpbin.org
                              port: 8080
                              weight: 100
                            items:
                              description: The definition for an upstream endpoint.
                              required:
                              - host
                              - port
                              - weight
                              type: object
                              properties:
                                host:
                                  description: Upstream host.
                                  pattern: ^\\*?[0-9a-zA-Z-._]+$
                                  type: string
                                  example: httpbin.org
                                port:
                                  description: Upstream port.
                                  maximum: 65535
                                  minimum: 1
                                  type: integer
                                  example: 8080
                                weight:
                                  description: Upstream weight.
                                  maximum: 65535
                                  minimum: 0
                                  type: integer
                                  example: 100
                                priority:
                                  description: Node priority. A higher value corresponds
                                    to a higher priority.
                                  type: integer
                                  default: 0
                          service_name:
                            description: Service name in the service registry. Only
                              valid for service discovery.
                            type: string
                            minLength: 1
                            maxLength: 256
                            example: <ServiceRegistryID>/public/group/httpbin
                          discovery_type:
                            type: string
                            description: Type of service discovery. Only valid for
                              service discovery.
                            enum:
                            - kubernetes
                            - nacos
                            - consul
                            example: nacos
                          discovery_args:
                            description: Service discovery arguments. Only valid for
                              service discovery.
                            type: object
                            properties:
                              metadata:
                                type: object
                                additionalProperties:
                                  type: string
                                example:
                                  namespace_id: public
                                  group_name: DEFAULT_GROUP
                          tls:
                            deprecated: true
                            description: Replace with `client_certificate` and `ca_certificates`
                            oneOf:
                            - properties:
                                client_cert:
                                  type: string
                                  description: Certificate.
                                  oneOf:
                                  - title: Certificate Reference
                                    description: Path to the certificate in environment
                                      variable or secret manager.
                                    type: string
                                    pattern: ^\$(secret|env|ENV)://
                                    example: $secret://aws/john/apisix-secrets/john-key-auth
                                  - title: Certificate Content
                                    type: string
                                    minLength: 1
                                    maxLength: 65536
                                    pattern: ^[^\$]
                                    description: The certificate in PEM format.
                                    example: '-----BEGIN CERTIFICATE-----

                                      ...

                                      -----END CERTIFICATE-----'
                                client_key:
                                  type: string
                                  description: Private key.
                                  oneOf:
                                  - title: Private Key Reference
                                    description: Path to the private key in environment
                                      variable or secret manager.
                                    type: string
                                    pattern: ^\$(secret|env|ENV)://
                                    example: $secret://aws/john/apisix-secrets/john-key-auth
                                  - title: Private Key Content
                                    type: string
                                    minLength: 1
                                    maxLength: 65536
                                    pattern: ^[^\$]
                                    description: The private key in PEM format.
                                    example: '-----BEGIN PRIVATE KEY-----

                                      ...

                                      -----END PRIVATE KEY-----'
                              required:
                              - client_cert
                              - client_key
                            - properties:
                                client_cert_id:
                                  description: The object ID.
                                  type: string
                                  pattern: ^[a-zA-Z0-9-_.]+$
                                  minLength: 1
                                  maxLength: 256
                                  example: bd58fce2-b6cc-4d2d-a53c-6ce11b19c101
                              required:
                              - client_cert_id
                          client_certificate:
                            description: The object ID.
                            type: string
                            pattern: ^[a-zA-Z0-9-_.]+$
                            minLength: 1
                            maxLength: 256
                            example: bd58fce2-b6cc-4d2d-a53c-6ce11b19c101
                          ca_certificates:
                            type: array
                            description: CA certificates.
                            items:
                              description: The object ID.
                              type: string
                              pattern: ^[a-zA-Z0-9-_.]+$
                              minLength: 1
                              maxLength: 256
                              example: bd58fce2-b6cc-4d2d-a53c-6ce11b19c101
                          tls_verify:
                            type: boolean
                            description: If true, verify TLS.
                          checks:
                            type: object
                            description: Health check configurations.
                            anyOf:
                            - title: Active Check
                              required:
                              - active
                              properties:
                                active:
                                  type: object
                                  description: Active health check configurations.
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - http
                                      - https
                                      - tcp
                                      default: http
                                      description: Active check probing type.
                                    timeout:
                                      type: number
                                      format: float
                                      default: 1
                                      description: Active check timeout in seconds.
                                    concurrency:
                                      type: integer
                                      format: int32
                                      default: 10
                                      description: The number of targets to be checked
                                        at the same time during the active check.
                                    host:
                                      type: string
                                      description: The HTTP host.
                                      pattern: ^\*?[0-9a-zA-Z-._]+$
                                      example: httpbin.org
                                    port:
                                      type: integer
                                      minimum: 1
                                      maximum: 65535
                                      format: int32
                                      description: By default, the port is the same
                                        as the one defined in the upstream target.
                                    http_path:
                                      type: string
                                      default: /
                                      description: The HTTP path in HTTP probe requests.
                                    https_verify_certificate:
                                      type: boolean
                                      description: Whether to verify the target's
                                        TLS certificate.
                                      default: true
                                    req_headers:
                                      type: array
                                      description: The request headers.
                                      minItems: 1
                                      uniqueItems: true
                                      items:
                                        type: string
                                        example: 'user-agent: go/1.20'
                                    healthy:
                                      type: object
                                      description: Active health check healthy configurations.
                                      properties:
                                        interval:
                                          default: 1
                                          minimum: 1
                                          type: integer
                                          format: int32
                                          description: Time interval of checking healthy
                                            targets in seconds.
                                        http_statuses:
                                          default:
                                          - 200
                                          - 302
                                          type: array
                                          minItems: 1
                                          description: A list of HTTP response status
                                            codes which are considered healthy.
                                          items:
                                            minimum: 200
                                            maximum: 599
                                            type: integer
                                        successes:
                                          minimum: 1
                                          type: integer
                                          default: 2
                                          format: int32
                                          description: The number of successful probes
                                            to define a healthy target.
                                    unhealthy:
                                      type: object
                                      description: Active health check unhealthy configurations.
                                      properties:
                                        interval:
                                          default: 1
                                          minimum: 1
                                          type: integer
                                          format: int32
                                          description: Time interval of checking unhealthy
                                            targets in seconds.
                                        http_statuses:
                                          type: array
                                          default:
                                          - 429
                                          - 404
                                          - 500
                                          - 501
                                          - 502
                                          - 503
                                          - 504
                                          - 505
                                          minItems: 1
                                          uniqueItems: true
                                          description: A list of HTTP response status
                                            codes which are considered unhealthy.
                                          items:
                                            minimum: 200
                                            maximum: 599
                                            type: integer
                                        http_failures:
                                          minimum: 1
                                          maximum: 254
                                          type: integer
                                          default: 5
                                          format: int32
                                          description: The number of HTTP-related
                                            failures to define an unhealthy target.
                                        tcp_failures:
                                          minimum: 1
                                          maximum: 254
                                          type: integer
                                          default: 2
                                          format: int32
                                          description: The number of TCP-related failures
                                            to define an unhealthy target.
                                        timeouts:
                                          minimum: 1
                                          maximum: 254
                                          default: 3
                                          type: integer
                                          format: int32
                                          description: The number of probe timeouts
                                            to define an unhealthy target.
                            - title: Passive Check
                              required:
                              - active
                              - passive
                              properties:
                                active:
                                  type: object
                                  description: Active health check configurations.
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - http
                                      - https
                                      - tcp
                                      default: http
                                      description: Active check probing type.
                                    timeout:
                                      type: number
                                      format: float
                                      default: 1
                                      description: Active check timeout in seconds.
                                    concurrency:
                                      type: integer
                                      format: int32
                                      default: 10
                                      description: The number of targets to be checked
                                        at the same time during the active check.
                                    host:
                                      type: string
                                      description: The HTTP host.
                                      pattern: ^\*?[0-9a-zA-Z-._]+$
                                      example: httpbin.org
                                    port:
                                      type: integer
                                      minimum: 1
                                      maximum: 65535
                                      format: int32
                                      description: By default, the port is the same
                                        as the one defined in the upstream target.
                                    http_path:
                                      type: string
                                      default: /
                                      description: The HTTP path in HTTP probe requests.
                                    https_verify_certificate:
                                      type: boolean
                                      description: Whether to verify the target's
                                        TLS certificate.
                                      default: true
                                    req_headers:
                                      type: array
                                      description: The request headers.
                                      minItems: 1
                                      uniqueItems: true
                                      items:
                                        type: string
                                        example: 'user-agent: go/1.20'
                                    healthy:
                                      type: object
                                      description: Active health check healthy configurations.
                                      properties:
                                        interval:
                                          default: 1
                                          minimum: 1
                                          type: integer
                                          format: int32
                                          description: Time interval of checking healthy
                                            targets in seconds.
                                        http_statuses:
                                          default:
                                          - 200
                                          - 302
                                          type: array
                                          minItems: 1
                                          description: A list of HTTP response status
                                            codes which are considered healthy.
                                          items:
                                            minimum: 200
                                            maximum: 599
                                            type: integer
                                        successes:
                                          minimum: 1
                                          type: integer
                                          default: 2
                                          format: int32
                                          description: The number of successful probes
                                            to define a healthy target.
                                    unhealthy:
                                      type: object
                                      description: Active health check unhealthy configurations.
                                      properties:
                                        interval:
                                          default: 1
                                          minimum: 1
                                          type: integer
                                          format: int32
                                          description: Time interval of checking unhealthy
                                            targets in seconds.
                                        http_statuses:
                                          type: array
                                          default:
                                          - 429
                                          - 404
                                          - 500
                                          - 501
                                          - 502
                                          - 503
                                          - 504
                                          - 505
                                          minItems: 1
                                          uniqueItems: true
                                          description: A list of HTTP response status
                                            codes which are considered unhealthy.
                                          items:
                                            minimum: 200
                                            maximum: 599
                                            type: integer
                                        http_failures:
                                          minimum: 1
                                          maximum: 254
                                          type: integer
                                          default: 5
                                          format: int32
                                          description: The number of HTTP-related
                                            failures to define an unhealthy target.
                                        tcp_failures:
                                          minimum: 1
                                          maximum: 254
                                          type: integer
                                          default: 2
                                          format: int32
                                          description: The number of TCP-related failures
                                            to define an unhealthy target.
                                        timeouts:
                                          minimum: 1
                                          maximum: 254
                                          default: 3
                                          type: integer
                                          format: int32
                                          description: The number of probe timeouts
                                            to define an unhealthy target.
                                passive:
                                  type: object
                                  description: Passive health check configurations.
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - http
                                      - https
                                      - tcp
                                      default: http
                                      description: Active check probing type.
                                    healthy:
                                      type: object
                                      description: Passive health check healthy configurations.
                                      properties:
                                        http_statuses:
                                          type: array
                                          default:
                                          - 200
                                          - 201
                                          - 202
                                          - 203
                                          - 204
                                          - 205
                                          - 206
                                          - 207
                                          - 208
                                          - 226
                                          - 300
                                          - 301
                                          - 302
                                          - 303
                                          - 304
                                          - 305
                                          - 306
                                          - 307
                                          - 308
                                          minItems: 1
                                          uniqueItems: true
                                          description: A list of HTTP response status
                                            codes which are considered healthy.
                                          items:
                                            minimum: 200
                                            maximum: 599
                                            type: integer
                                        successes:
                                          minimum: 0
                                          type: integer
                                          default: 5
                                          format: int32
                                          description: The number of successful probes
                                            to define a healthy target.
                                    unhealthy:
                                      type: object
                                      description: Passive health check unhealthy
                                        configurations.
                                      properties:
                                        http_statuses:
                                          type: array
                                          default:
                                          - 429
                                          - 500
                                          - 503
                                          minItems: 1
                                          uniqueItems: true
                                          description: A list of HTTP response status
                                            codes which are considered unhealthy.
                                          items:
                                            minimum: 200
                                            maximum: 599
                                            type: integer
                                        tcp_failures:
                                          minimum: 0
                                          maximum: 254
                                          type: integer
                                          default: 2
                                          format: int32
                                          description: The number of TCP-related failures
                                            to define an unhealthy target.
                                        timeouts:
                                          minimum: 0
                                          maximum: 254
                                          default: 7
                                          type: integer
                                          format: int32
                                          description: The number of probe timeouts
                                            to define an unhealthy target.
                                        http_failures:
                                          minimum: 0
                                          maximum: 254
                                          type: integer
                                          default: 5
                                          format: int32
                                          description: The number of HTTP-related
                                            failures to define an unhealthy target.
                        oneOf:
                        - title: Use Upstream Nodes
                          required:
                          - nodes
                        - title: Use Service Registry
                          required:
                          - service_name
                          - discovery_type
                - title: Stream
                  allOf:
                  - type: object
                    properties:
                      name:
                        maxLength: 65536
                        description: The object name.
                        type: string
                        minLength: 1
                        example: us-west-rsc
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                          pattern: ^.+$
                          minLength: 1
                          maxLength: 65536
                        description: Key-value pairs of labels.
                        example:
                          version: v2
                          env: prod
                      desc:
                        description: The object description.
                        type: string
                        maxLength: 65536
                        example: Object description.
                      type:
                        type: string
                        description: Type of service. `http` corresponds to L7 service
                          and `stream` corresponds to L4 service.
                        enum:
                        - http
                        - stream
                        default: http
                  - type: object
                    required:
                    - type
                    properties:
                      type:
                        type: string
                        description: Type of service. `stream` corresponds to L4 service.
                        enum:
