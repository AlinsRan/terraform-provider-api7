        required: true
        schema:
          minimum: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: The route with the service ID.
              allOf:
              - description: The route description.
                type: object
                required:
                - name
                - paths
                allOf:
                - type: object
                  properties:
                    name:
                      maxLength: 65536
                      description: The object name.
                      type: string
                      minLength: 1
                      example: us-west-rsc
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                        pattern: ^.+$
                        minLength: 1
                        maxLength: 65536
                      description: Key-value pairs of labels.
                      example:
                        version: v2
                        env: prod
                    desc:
                      description: The object description.
                      type: string
                      maxLength: 65536
                      example: Object description.
                    methods:
                      description: The allowed HTTP methods to access the route. If
                        empty, all HTTP methods are allowed.
                      type: array
                      uniqueItems: true
                      minItems: 1
                      maxItems: 9
                      items:
                        type: string
                        description: The API (HTTP) method.
                        enum:
                        - GET
                        - POST
                        - PUT
                        - DELETE
                        - PATCH
                        - HEAD
                        - OPTIONS
                        - CONNECT
                        - TRACE
                    vars:
                      description: Conditions in the format of [APISIX expressions](https://docs.api7.ai/apisix/reference/apisix-expressions)
                        to match requests to routes. Case sensitive when matching
                        a cookie name.
                      type: array
                      example:
                      - - arg_version
                        - ==
                        - v2
                      - - arg_ttl
                        - <
                        - 3600
                      items: {}
                    paths:
                      maxItems: 64
                      minItems: 1
                      type: array
                      description: The URL path(s) (after the service's `path_prefix`)
                        that the route will listen to. Each path should start with
                        a `/`.
                      items:
                        type: string
                        minLength: 1
                        maxLength: 4096
                        example: /get
                    priority:
                      type: integer
                      default: 0
                      description: Priority of the route. A higher value corresponds
                        to a higher priority. If different Routes matches to the same
                        URI, then the Route with the highest priority will be matched.
                    enable_websocket:
                      type: boolean
                      description: If true, enable Websocket proxying for the route.
                      nullable: true
                - type: object
                  properties:
                    timeout:
                      description: Timeout settings for connecting to, sending, and
                        receiving messages from the upstream, in seconds.
                      type: object
                      properties:
                        connect:
                          minimum: 0
                          exclusiveMinimum: true
                          type: integer
                          default: 60
                          description: Connection timeout in seconds.
                        send:
                          minimum: 0
                          exclusiveMinimum: true
                          type: integer
                          default: 60
                          description: Sending timeout in seconds.
                        read:
                          minimum: 0
                          exclusiveMinimum: true
                          type: integer
                          default: 60
                          description: Receiving timeout in seconds.
                    plugins:
