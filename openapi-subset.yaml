                  properties:
                    value:
                      type: object
                      description: The specific resource.
                - type: object
                  properties:
                    value:
                      type: object
                      properties:
                        id:
                          description: The object ID.
                          type: string
                          pattern: ^[a-zA-Z0-9-_.]+$
                          minLength: 1
                          maxLength: 256
                          example: bd58fce2-b6cc-4d2d-a53c-6ce11b19c101
                        type:
                          type: string
                          enum:
                          - api7_gateway
                          - api7_ingress_controller
                        name:
                          description: The object name.
                          type: string
                          minLength: 1
                          maxLength: 100
                          example: us-west-rsc
                        description:
                          type: string
                          description: Gateway group description.
                          example: Gateway group description.
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                            pattern: ^.+$
                            minLength: 1
                            maxLength: 65536
                          description: Key-value pairs of labels.
                          example:
                            version: v2
                            env: prod
                        enforce_service_publishing:
                          type: boolean
                          description: "If ture, bypass version control and rollback\
                            \ when updating services directly on a gateway group.\
                            \ \n"
                        created_at:
                          description: The object created timestamp.
                          type: integer
                          minimum: 0
                          example: 1742288232
                        updated_at:
                          description: The object updated timestamp.
                          type: integer
                          minimum: 0
                          example: 1742288235
                        config:
                          type: object
                          description: Control plane details.
                          properties:
                            control_plane_key_prefix:
                              type: string
                              description: The prefix of the key in the control plane
                                (etcd). The pattern is `/gateway_groups/{gateway_group_id}`.
                              example: /gateway_groups/us-west-1
                            control_plane_user:
                              type: string
                              description: The etcd user.
                              example: etcd_user
                            control_plane_password:
                              type: string
                              description: The etcd password.
                              example: safe_password
                            image_tag:
                              type: string
                              description: The API7 gateway version.
                              example: latest
        '400':
          description: Invalid arguments. Error details will be provided in the response.
          content: {}
components:
  securitySchemes:
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    BasicAuth:
      type: http
      scheme: basic
