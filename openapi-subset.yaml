                            example: $host
                          retries:
                            description: The number of retries while passing the request
                              to an upstream using the underlying Nginx mechanism.
                            minimum: 0
                            maximum: 65535
                            type: integer
                          retry_timeout:
                            description: Timeout to continue with retries. Setting
                              this to 0 disables the retry timeout.
                            type: number
                            format: float
                            minimum: 0
                            default: 0
                          timeout:
                            description: Timeout settings for connecting to, sending,
                              and receiving messages from the upstream, in seconds.
                            type: object
                            properties:
                              connect:
                                minimum: 0
                                exclusiveMinimum: true
