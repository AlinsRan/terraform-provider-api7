  /api/gateway_groups:
    get:
      tags:
      - Gateway Group
      summary: List all gateway groups
      operationId: listGatewayGroups
      description: 'IAM Action: `gateway:GetGatewayGroup`, Resource: `arn:api7:gateway:gatewaygroup/%s`'
      parameters:
      - name: direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Order to list the resources by. The sorting index follows the
          configuration of `order_by`.
        in: query
      - name: page_size
        schema:
          type: integer
          format: int32
          minimum: 1
        description: Number of resources listed per page. Used together with `page`.
          For example, when there are 13 resources in total, if the query parameters
          are `page=1&page_size=10`, the GET response will show the route `total`
          as `13` and display 10 resources in the first page. If the query parameters
          are `page=2&page_size=10`, the GET response will show the route `total`
          as `13` and display 3 resources in the second page.
        in: query
      - name: page
        schema:
          type: integer
          format: int32
          minimum: 1
        description: Page number of the listed resources. Used together with `page_size`.
          For example, when there are 13 resources in total, if the query parameters
          are `page=1&page_size=10`, the GET response will show the route `total`
          as `13` and display 10 resources in the first page. If the query parameters
          are `page=2&page_size=10`, the GET response will show the route `total`
          as `13` and display 3 resources in the second page.
        in: query
      - name: order_by
        in: query
        description: Index to order resources by.
        schema:
          type: string
          default: updated_at
          enum:
          - created_at
          - updated_at
          description: Ascending or descending order to list the resources, by `created_at`
            or `updated_by` configured in `order_by`.
      - name: search
        in: query
        schema:
          type: string
        description: Condition to search resources by.
        example: version%3Dv2
      - name: name
        description: Gateway group name.
        example: default
        in: query
        schema:
          minimum: 1
          type: string
      - name: labels
        in: query
        required: false
        description: Label(s) to filter resources by. The format is `labels[key]=value`
          and should be URL-encoded.
        schema:
          type: string
          minLength: 1
          example: labels%5Bversion%5D=v2
      responses:
        '200':
          description: Successfully retrieved the paginated list of gateway groups.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  description: The outer structure for encapsulating a list of resources.
                  properties:
                    list:
                      type: array
                      description: An array of resources.
                      items:
                        type: object
                    total:
                      type: integer
                      minimum: 0
                      example: 1
                      description: Total number of objects.
                - type: object
                  properties:
                    list:
                      type: array
                      description: An array of gateway groups.
                      items:
                        type: object
                        properties:
                          id:
                            description: The object ID.
                            type: string
                            pattern: ^[a-zA-Z0-9-_.]+$
                            minLength: 1
                            maxLength: 256
                            example: bd58fce2-b6cc-4d2d-a53c-6ce11b19c101
                          type:
                            type: string
                            enum:
                            - api7_gateway
                            - api7_ingress_controller
                          name:
                            description: The object name.
                            type: string
                            minLength: 1
                            maxLength: 100
                            example: us-west-rsc
                          description:
                            type: string
                            description: Gateway group description.
                            example: Gateway group description.
                          labels:
                            type: object
                            additionalProperties:
                              type: string
                              pattern: ^.+$
                              minLength: 1
                              maxLength: 65536
                            description: Key-value pairs of labels.
                            example:
                              version: v2
                              env: prod
                          enforce_service_publishing:
                            type: boolean
                            description: "If ture, bypass version control and rollback\
                              \ when updating services directly on a gateway group.\
                              \ \n"
                          created_at:
                            description: The object created timestamp.
                            type: integer
                            minimum: 0
                            example: 1742288232
                          updated_at:
                            description: The object updated timestamp.
                            type: integer
                            minimum: 0
                            example: 1742288235
                          config:
                            type: object
                            description: Control plane details.
                            properties:
                              control_plane_key_prefix:
                                type: string
                                description: The prefix of the key in the control
                                  plane (etcd). The pattern is `/gateway_groups/{gateway_group_id}`.
                                example: /gateway_groups/us-west-1
                              control_plane_user:
                                type: string
                                description: The etcd user.
                                example: etcd_user
                              control_plane_password:
                                type: string
                                description: The etcd password.
                                example: safe_password
                              image_tag:
                                type: string
                                description: The API7 gateway version.
                                example: latest
        '400':
          description: Invalid arguments. Error details will be provided in the response.
          content: {}
