  /apisix/admin/services/{service_id}:
    get:
      tags:
      - Published Service
      summary: Get a published service on a gateway group
      operationId: getPublishedService
      description: 'Get one published service through an APISIX Admin API compatible
        endpoint under `/apisix/admin/`. The response keeps APISIX field conventions
        for migration and interoperability scenarios.

        **Required IAM Permission:** Action `gateway:GetPublishedService`, Resource
        `arn:api7:gateway:gatewaygroup/%s/publishedservice/%s`'
      parameters:
      - name: service_id
        description: The unique identifier of the published service.
        in: path
        required: true
        schema:
          description: The object ID.
          type: string
          pattern: ^[a-zA-Z0-9-_.]+$
          minLength: 1
          maxLength: 256
          example: bd58fce2-b6cc-4d2d-a53c-6ce11b19c101
      - name: gateway_group_id
        description: Gateway group ID. Optional when using the gateway group admin
          key to authenticate.
        example: 86fb9981-d9d2-4555-9df8-91ae92129335
        in: query
        required: true
        schema:
          minimum: 1
          type: string
      - name: with_publish_info
        description: If true, include publish information in the response, such as
          `apisix_route_id`, `route_version_id`, and `service_version_id`. The additional
          information is only useful for the Dashboard and not for API users.
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Successfully retrieved the service template.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  description: The outer structure for encapsulating the specific
                    resource.
                  properties:
                    value:
                      type: object
                      description: The specific resource.
                - type: object
                  properties:
                    value:
                      description: The service with management fields.
                      allOf:
                      - description: The service description.
                        type: object
                        required:
                        - name
                        minProperties: 1
                        allOf:
                        - type: object
                          properties:
                            name:
                              maxLength: 65536
                              description: The object name.
                              type: string
                              minLength: 1
                              example: us-west-rsc
                            labels:
                              type: object
                              additionalProperties:
                                type: string
                                pattern: ^.+$
                                minLength: 1
                                maxLength: 65536
                              description: Key-value pairs of labels.
                              example:
                                version: v2
                                env: prod
                            desc:
                              description: The object description.
                              type: string
                              maxLength: 65536
                              example: Object description.
                            type:
                              type: string
                              description: Type of service. `http` corresponds to
                                L7 service and `stream` corresponds to L4 service.
                              enum:
                              - http
                              - stream
                              default: http
                      - type: object
                        properties:
                          id:
                            description: The object ID.
                            type: string
                            pattern: ^[a-zA-Z0-9-_.]+$
                            minLength: 1
                            maxLength: 256
                            example: bd58fce2-b6cc-4d2d-a53c-6ce11b19c101
                          last_published:
                            description: The object timestamp.
